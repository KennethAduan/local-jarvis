[package]
name = "jarvis-kokoro"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
misaki-rs = { version = "=0.9.0", default-features = false }

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "=2.0.1", default-features = false, features = ["shared"] }

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = "=2.0.1"
